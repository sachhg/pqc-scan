# CI for pqc-scan itself: run the test suite across supported Pythons and
# smoke-test the CLI by scanning the repo's own fixtures.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"

      - name: Run test suite (with coverage)
        run: python -m pytest -q --cov=pqcscan --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Smoke-test the CLI on Windows
        run: pqc-scan scan tests/fixtures --output sarif --output-file pqc-scan.sarif

  smoke-cli:
    name: Smoke-test the CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Scan fixtures in every output format
        run: |
          set -euo pipefail
          pqc-scan scan tests/fixtures -s low --output sarif    --output-file pqc-scan.sarif
          pqc-scan scan tests/fixtures -s low --output cbom     --output-file cbom.json
          pqc-scan scan tests/fixtures -s low --output markdown --output-file pqc-scan.md
          pqc-scan scan tests/fixtures -s low --output json     --output-file pqc-scan.json

      - name: Validate the machine-readable reports
        run: |
          python -c "import json; d=json.load(open('pqc-scan.sarif')); assert d['version']=='2.1.0'; assert d['runs'][0]['results']"
          python -c "import json; d=json.load(open('cbom.json')); assert d['bomFormat']=='CycloneDX'; assert d['components']"
          python -c "import json; d=json.load(open('pqc-scan.json')); assert d['summary']['total']>0"

      - name: Smoke-test the other commands
        run: |
          set -euo pipefail
          pqc-scan rules --json > /dev/null
          pqc-scan explain PQC001 > /dev/null
          pqc-scan explain PQC016 --json > /dev/null
          # A baseline of the fixtures must make a rescan completely clean.
          pqc-scan baseline tests/fixtures -s low --output-file baseline.json
          pqc-scan scan tests/fixtures -s low --baseline baseline.json \
            --fail-on-findings --output json --output-file /dev/null

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: pqc-scan-reports
          path: |
            pqc-scan.sarif
            pqc-scan.md
            cbom.json
